name: CI Github Pages
on:
  #监听push操作
  push:
    branches:
      - main # 这里只配置了main分支，所以只有推送main分支才会触发以下任务
jobs:
  # 任务ID
  build-and-deploy:
    # 运行环境
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 步骤
    steps:
      # 官方action，将代码拉取到虚拟机
      - name: Checkout  ️ 
        uses: actions/checkout@v4
      - name: Install pnpm   # 从 package.json 的 packageManager 字段读取版本，避免版本冲突
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and Build   # 安装依赖、打包
        env:
          # 部署模式说明：
          # 1. 静态模式（默认）：不设置 VITE_API_BASE secret
          #    - 直连东方财富 API + Open-Meteo 天气 API
          #    - 内置 3 个公共 CORS 代理容错（直连失败自动切换）
          #    - 推送代码即自动部署，无需额外配置
          #
          # 2. Worker 代理模式（推荐，解决 ERR_CONNECTION_CLOSED）：
          #    - 部署 cloudflare-worker/cors-proxy.js 到 Cloudflare Workers（免费）
          #    - 设置 VITE_API_BASE = https://your-worker.workers.dev
          #    - 所有 API 请求通过 Cloudflare 代理，稳定可靠
          #
          # 3. 完整模式：设置 VITE_API_BASE 为远程 Flask 后端地址
          #    - 启用全部功能（融资数据、IPO日历、财经新闻等）
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          pnpm install
          pnpm run build

      - name: Deploy   # 部署
        uses: JamesIves/github-pages-deploy-action@v4.3.3
        with:
          branch: gh-pages # 部署后提交到那个分支
          folder: dist # 这里填打包好的目录名称
